name: quality

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans full history
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # uv installs in ~1-3s where pipx takes 5-15s building a venv.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv tool install pre-commit==4.6.0
      - run: pre-commit run --all-files --show-diff-on-failure
      - run: pre-commit run --all-files --hook-stage pre-push

  workflow-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - run: uv tool install zizmor==1.25.2
      - run: zizmor --format=github .
        env:
          # Without a token zizmor silently skips its online audits
          # (impostor-commit, known-vulnerable/unpinned-uses).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
